name: Build Android Debug APK

on:
  workflow_dispatch:
    inputs:
      enable_cache:
        description: '¿Habilitar y usar Caché de compilación? (C++, Rust, Gradle)'
        required: true
        type: boolean
        default: true

jobs:
  build:
    name: Compilar APK Debug con Motores C++ (llama.cpp) y Rust (Candle) con NDK y Caché Configurable
    runs-on: ubuntu-latest

    steps:
      # 1. Clonar el repositorio
      - name: Clonar repositorio
        uses: actions/checkout@v4

      # 2. Configurar JDK 17
      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Instalar herramientas de compilación C++ nativas del sistema (Ninja, CCache, Clang, 7-Zip)
      - name: Instalar dependencias C++ del sistema (Ninja, CCache, Clang, 7-Zip)
        run: |
          echo "=== Instalando herramientas de compilación C++ nativas y 7-Zip para Linux/Android ==="
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache clang llvm lld pkg-config build-essential p7zip-full
          echo "Ninja: $(ninja --version)"
          echo "CCache: $(ccache --version | head -n 1)"
          echo "Clang: $(clang --version | head -n 1)"
          echo "7-Zip: $(7z | head -n 2 | tail -n 1)"

      # 4. Configurar Android SDK, NDK y CMake para C++ (llama.cpp / GGUF)
      - name: Configurar Android NDK y CMake para C++
        run: |
          echo "=== Instalando y configurando Android NDK y CMake para C++ ==="
          echo "ANDROID_HOME: $ANDROID_HOME"
          yes | sdkmanager --licenses || true
          yes | sdkmanager --install "cmake;3.22.1" "ndk;28.2.13676358" "build-tools;36.0.0" || true
          
          # Detectar y configurar ruta del NDK
          NDK_DIR="$ANDROID_HOME/ndk/28.2.13676358"
          if [ ! -d "$NDK_DIR" ]; then
            NDK_DIR=$(find "$ANDROID_HOME/ndk" -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)
          fi
          
          echo "NDK detectado en: $NDK_DIR"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$NDK_DIR" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmake/3.22.1/bin" >> $GITHUB_PATH
          echo "$NDK_DIR" >> $GITHUB_PATH
          echo "CMake y NDK configurados correctamente."

      # 5. Configurar Caché para artefactos de compilación C++ (CMake, Ninja y CCache)
      - name: Caché para compilación C++ (CMake, Ninja & CCache)
        if: ${{ inputs.enable_cache != false }}
        uses: actions/cache@v4
        with:
          path: |
            ~/.ccache
            app/.cxx
            app/build/intermediates/cxx
            app/build/intermediates/cmake
          key: ${{ runner.os }}-cpp-cmake-ccache-${{ hashFiles('app/src/main/cpp/**', 'app/build.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-cpp-cmake-ccache-
            ${{ runner.os }}-cpp-cmake-

      # 6. Configurar Rust Toolchain y Targets Android para Hugging Face Candle
      - name: Instalar Rust y targets Android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      # 7. Configurar Caché inteligente para Rust, crates y artefactos Candle
      - name: Configurar Caché para Rust y dependencias Cargo
        if: ${{ inputs.enable_cache != false }}
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            app/src/main/rust -> target

      - name: Caché para binario cargo-ndk
        if: ${{ inputs.enable_cache != false }}
        uses: actions/cache@v4
        id: cache-cargo-ndk
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: ${{ runner.os }}-cargo-ndk-bin

      - name: Instalar cargo-ndk
        if: ${{ inputs.enable_cache == false || steps.cache-cargo-ndk.outputs.cache-hit != 'true' }}
        run: |
          cargo install cargo-ndk || true

      # 8. Compilar librería nativa Rust Candle (liblocal_ai_rust.so) para ABIs Android
      - name: Compilar librería nativa Rust Candle
        run: |
          echo "=== Compilando Hugging Face Candle SafeTensors para Android con cargo-ndk ==="
          mkdir -p app/src/main/jniLibs
          cd app/src/main/rust
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -o ../jniLibs build --release || true
          cd ../../../..

      # 9. Configurar Gradle oficial con la versión exacta del proyecto (9.3.1) y caché configurable
      - name: Configurar Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-disabled: ${{ inputs.enable_cache == false }}
          cache-read-only: false

      # 10. Limpieza previa si se ejecuta en modo sin caché
      - name: Limpieza de compilación (Modo Sin Caché)
        if: ${{ inputs.enable_cache == false }}
        run: |
          echo "=== Modo sin caché activo: eliminando cachés locales de ccache y build ==="
          ccache -C || true
          rm -rf app/.cxx app/build

      # 11. Generar la llave de firma Debug (debug.keystore) en la raíz del proyecto
      - name: Generar debug.keystore en la raíz del proyecto
        run: |
          echo "=== Configurando debug.keystore para compilación ==="
          
          # 1. Intentar decodificar desde base64 si existe y tiene contenido
          if [ -s debug.keystore.base64 ]; then
            echo "Decodificando debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore || base64 --decode -i debug.keystore.base64 > debug.keystore || true
          fi
          
          # 2. Si no existe o tiene tamaño 0, generarlo con keytool de forma no interactiva
          if [ ! -s debug.keystore ]; then
            echo "Generando nuevo debug.keystore con keytool..."
            keytool -genkeypair -v -noprompt \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          
          # 3. Asegurar permisos de lectura
          chmod 644 debug.keystore
          
          # 4. Replicar en directorios alternativos para compatibilidad
          mkdir -p ~/.android app
          cp -f debug.keystore ~/.android/debug.keystore || true
          cp -f debug.keystore app/debug.keystore || true
          
          # 5. Verificar que el archivo existe y es válido
          echo "Verificando archivo debug.keystore creado:"
          ls -la debug.keystore
          keytool -list -keystore debug.keystore -storepass android -alias androiddebugkey

      # 12. Dar permisos de ejecución al wrapper de Gradle (si existe)
      - name: Preparar Gradle Wrapper
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
          fi

      # 13. Compilar el APK en modo Debug (C++ CMake, NDK, Rust y Gradle)
      - name: Compilar APK Debug con Gradle
        run: |
          if [ ! -s debug.keystore ]; then
            keytool -genkeypair -v -noprompt -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          
          GRADLE_FLAGS="--no-daemon --stacktrace"
          if [ "${{ inputs.enable_cache }}" = "false" ]; then
            echo "=== Desactivando build-cache en Gradle ==="
            GRADLE_FLAGS="$GRADLE_FLAGS --no-build-cache"
          fi
          
          if [ -f ./gradlew ]; then
            ./gradlew assembleDebug $GRADLE_FLAGS
          else
            gradle assembleDebug $GRADLE_FLAGS
          fi

      # 14. Comprimir el APK con 7-Zip Ultra (LZMA2 / -mx=9 / Solid) para descarga rápida en conexiones móviles
      - name: Comprimir APK con 7-Zip (Ultra LZMA2)
        run: |
          echo "=== Comprimiendo APK Debug con 7-Zip (LZMA2 Ultra) ==="
          mkdir -p dist_7z
          APK_FILE=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "Error: No se encontró el archivo APK generado en app/build/outputs/apk/debug"
            exit 1
          fi
          
          echo "Archivo APK original:"
          ls -lh "$APK_FILE"
          
          # Compresión sólida con nivel 9 (Ultra), diccionario de 64MB y algoritmo LZMA2
          7z a -t7z -m0=lzma2 -mx=9 -mfb=64 -md=64m -ms=on dist_7z/AI-Local-Debug-APK.7z "$APK_FILE"
          
          echo "Archivo 7z Ultra comprimido generado:"
          ls -lh dist_7z/AI-Local-Debug-APK.7z
          
          ORIGINAL_SIZE=$(stat -c%s "$APK_FILE" 2>/dev/null || stat -f%z "$APK_FILE")
          COMPRESSED_SIZE=$(stat -c%s dist_7z/AI-Local-Debug-APK.7z 2>/dev/null || stat -f%z dist_7z/AI-Local-Debug-APK.7z)
          REDUCTION=$(( (ORIGINAL_SIZE - COMPRESSED_SIZE) * 100 / ORIGINAL_SIZE ))
          echo "Reducción de tamaño: $REDUCTION% (Original: $ORIGINAL_SIZE bytes -> Comprimido: $COMPRESSED_SIZE bytes)"

      # 15. Subir el APK ultra-comprimido (.7z) como artefacto descargable en GitHub Actions
      - name: Subir APK Debug Ultra Comprimido (.7z) como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: AI-Local-Debug-APK-7z
          path: dist_7z/AI-Local-Debug-APK.7z
          retention-days: 14

      # 16. Subir también el APK directo para compatibilidad estándar
      - name: Subir APK Debug directo como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: AI-Local-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
