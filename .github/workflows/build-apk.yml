name: Build Android Debug APK

on:
  workflow_dispatch: # Se activa exclusivamente de forma manual desde la pestaña Actions en GitHub

jobs:
  build:
    name: Compilar APK Debug con Motores C++ (llama.cpp) y Rust (Candle) con NDK y Caché
    runs-on: ubuntu-latest

    steps:
      # 1. Clonar el repositorio
      - name: Clonar repositorio
        uses: actions/checkout@v4

      # 2. Configurar JDK 17
      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Configurar Android SDK, NDK y CMake para C++ (llama.cpp / GGUF)
      - name: Configurar Android NDK y CMake para C++
        run: |
          echo "=== Instalando y verificando componentes Android NDK y CMake para C++ ==="
          echo "ANDROID_HOME: $ANDROID_HOME"
          yes | sdkmanager --licenses || true
          yes | sdkmanager --install "cmake;3.22.1" "ndk;28.2.13676358" || true
          echo "CMake y NDK configurados correctamente."

      # 4. Configurar Caché para artefactos de compilación C++ (CMake y Ninja)
      - name: Caché para compilación C++ (CMake & Ninja)
        uses: actions/cache@v4
        with:
          path: |
            app/.cxx
            app/build/intermediates/cxx
            app/build/intermediates/cmake
          key: ${{ runner.os }}-cpp-cmake-${{ hashFiles('app/src/main/cpp/**', 'app/build.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-cpp-cmake-

      # 5. Configurar Rust Toolchain y Targets Android para Hugging Face Candle
      - name: Instalar Rust y targets Android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      # 6. Configurar Caché inteligente para Rust, crates y artefactos Candle
      - name: Configurar Caché para Rust y dependencias Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            app/src/main/rust -> target

      - name: Caché para binario cargo-ndk
        uses: actions/cache@v4
        id: cache-cargo-ndk
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: ${{ runner.os }}-cargo-ndk-bin

      - name: Instalar cargo-ndk (si no está en caché)
        if: steps.cache-cargo-ndk.outputs.cache-hit != 'true'
        run: |
          cargo install cargo-ndk || true

      # 7. Compilar librería nativa Rust Candle (liblocal_ai_rust.so) para ABIs Android
      - name: Compilar librería nativa Rust Candle
        run: |
          echo "=== Compilando Hugging Face Candle SafeTensors para Android con cargo-ndk ==="
          mkdir -p app/src/main/jniLibs
          cd app/src/main/rust
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -o ../jniLibs build --release || true
          cd ../../../..

      # 8. Configurar Gradle oficial con la versión exacta del proyecto (9.3.1) y caché activo
      - name: Configurar Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-read-only: false

      # 9. Generar la llave de firma Debug (debug.keystore) en la raíz del proyecto
      - name: Generar debug.keystore en la raíz del proyecto
        run: |
          echo "=== Configurando debug.keystore para compilación ==="
          
          # 1. Intentar decodificar desde base64 si existe y tiene contenido
          if [ -s debug.keystore.base64 ]; then
            echo "Decodificando debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore || base64 --decode -i debug.keystore.base64 > debug.keystore || true
          fi
          
          # 2. Si no existe o tiene tamaño 0, generarlo con keytool de forma no interactiva
          if [ ! -s debug.keystore ]; then
            echo "Generando nuevo debug.keystore con keytool..."
            keytool -genkeypair -v -noprompt \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          
          # 3. Asegurar permisos de lectura
          chmod 644 debug.keystore
          
          # 4. Replicar en directorios alternativos para compatibilidad
          mkdir -p ~/.android app
          cp -f debug.keystore ~/.android/debug.keystore || true
          cp -f debug.keystore app/debug.keystore || true
          
          # 5. Verificar que el archivo existe y es válido
          echo "Verificando archivo debug.keystore creado:"
          ls -la debug.keystore
          keytool -list -keystore debug.keystore -storepass android -alias androiddebugkey

      # 10. Dar permisos de ejecución al wrapper de Gradle (si existe)
      - name: Preparar Gradle Wrapper
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
          fi

      # 11. Compilar el APK en modo Debug (C++ CMake y Gradle)
      - name: Compilar APK Debug con Gradle
        run: |
          if [ ! -s debug.keystore ]; then
            keytool -genkeypair -v -noprompt -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          
          if [ -f ./gradlew ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      # 12. Subir el APK como artefacto descargable en GitHub Actions
      - name: Subir APK Debug como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: AI-Local-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
