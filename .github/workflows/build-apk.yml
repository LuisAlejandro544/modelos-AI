name: Build Android Debug APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Permite compilar manualmente desde la pestaña Actions en GitHub

jobs:
  build:
    name: Compilar APK Debug
    runs-on: ubuntu-latest

    steps:
      # 1. Clonar el repositorio
      - name: Clonar repositorio
        uses: actions/checkout@v4

      # 2. Configurar JDK 17 con caché de Gradle integrado
      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # 3. Caché adicional para optimizar tiempos de compilación de Gradle
      - name: Configurar Caché de Gradle Build
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 4. Generar la llave de firma Debug (debug.keystore) en el root del proyecto para Gradle
      - name: Generar debug.keystore en la raíz del proyecto
        run: |
          echo "Verificando debug.keystore en el proyecto..."
          if [ -f debug.keystore.base64 ]; then
            echo "Decodificando debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            echo "Generando nuevo debug.keystore con keytool en la raíz..."
            keytool -genkey -v -keystore ./debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          
          # También copiar a ~/.android para compatibilidad global
          mkdir -p ~/.android
          cp -f ./debug.keystore ~/.android/debug.keystore || true
          ls -la ./debug.keystore

      # 5. Dar permisos de ejecución al wrapper de Gradle (si existe)
      - name: Preparar Gradle Wrapper
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
          fi

      # 6. Compilar el APK en modo Debug
      - name: Compilar APK Debug con Gradle
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      # 7. Subir el APK como artefacto descargable en GitHub Actions
      - name: Subir APK Debug como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: AI-Local-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
